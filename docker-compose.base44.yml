services:
  web:
    image: node:22
    working_dir: /workspace
    init: true
    restart: on-failure
    command: ["sh", "-ec", "npm ci --no-audit --no-fund && exec npm run dev"]
    ports:
      - "3000:8080"
    volumes:
      - .:/workspace
      - node_modules:/workspace/node_modules
    env_file:
      - /run/base44/app.env
    environment:
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=300
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8080/', { signal: AbortSignal.timeout(4000) }).then(async r => { if (!r.ok || !(await r.text()).includes('RockHound-GO')) throw new Error('Web app did not render'); }).catch(e => { console.error('Web healthcheck failed:', e.message); process.exit(1); })"
      interval: 30s
      timeout: 5s
      start_period: 120s
      retries: 3

volumes:
  node_modules:
