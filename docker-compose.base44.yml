services:
  web:
    image: node:22
    working_dir: /workspace
    volumes:
      - ./:/workspace
    ports:
      - "3000:8080"
    environment:
      # Vite >= 6.1 appends this to its allowedHosts so the preview proxy host is accepted.
      # The platform sets this to the sandbox domain wildcard (e.g. ".e2b.app"); pass it through.
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: ${__VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS}
      BASE44_PUBLIC_HOST_SUFFIX: ${BASE44_PUBLIC_HOST_SUFFIX}
      BASE44_SANDBOX_HOST_DOMAIN: ${BASE44_SANDBOX_HOST_DOMAIN}
    env_file:
      - /run/base44/app.env
    command: ["sh", "-ec", "corepack enable pnpm && pnpm install --frozen-lockfile && exec pnpm run dev"]
    restart: on-failure
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
